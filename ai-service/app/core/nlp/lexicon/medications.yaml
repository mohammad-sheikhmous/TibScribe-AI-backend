# Drugs — code -> variants + family (IMPLEMENTATION.md P5-04 / P5-13).
#
# `family` drives allergy cross-reactivity and interaction rules, so an unfamiliar drug
# is safer as an explicit `unknown_drug` flag than as a guess: v1 turned any unknown
# Latin token in an allergy sentence into a drug code, which produced entities like
# "medications" and "allergic".
#
# Variants deliberately include common Whisper mistranscriptions ("بروفن", "أمل وديبين"):
# a term list that only contains correct spellings misses the real transcript.

