# Symptom gazetteer — code -> Arabic surface variants (IMPLEMENTATION.md P5-04).
#
# Data, not code, so a clinician can extend it without touching Python. Variants
# include the DIALECT forms patients actually use and the systematic mistakes Whisper
# makes; a term list written only in formal Arabic matches almost nothing in a real
# transcript.
#
# Longer variants are matched first (see extraction.py), so "ألم أسفل البطن" wins over
# a bare "ألم".

headache:
  ar: صداع
  variants: [صداع, صداع نصفي, ألم بالرأس, وجع راس, وجع بالراس, ألم في الرأس]

blurred_vision:
  ar: تشوش بالرؤية
  variants: [تشوش بالرؤية, تشوش في الرؤية, تشوش الرؤية, تشوش بالنظر, تشوش في النظر, تشوش رؤية, زغللة, ضبابية بالعيون,
             عدم وضوح الرؤية, نظري مشوش, الرؤية عندها مشوشة, الرؤية مشوشة,
             الرؤية عندي مشوشة, الرؤية صارت مشوشة, النظر عندها مشوش]

