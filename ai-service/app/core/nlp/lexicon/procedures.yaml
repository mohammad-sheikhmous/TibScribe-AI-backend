# Procedures, treatments and follow-up actions (IMPLEMENTATION.md P5-07).
#
# This whole category was missing from v1's gazetteer, which is why `procedure` scored
# 18% and `follow_up` 10% coverage. Every code here was proposed by
# scripts/mine_lexicon.py from sentences the lexicon did not cover.
#
# ⚕️ Needs clinician sign-off before clinical use (same status as SOAP_MAPPING).

